<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title> Cadastro de Estudantes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('cadastro')">Cadastro</button>
            <button class="tab-btn" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="tabPerfil" onclick="switchTab('perfil')" style="display: none;">Meu Perfil</button>
        </nav>

        <div id="abaCadastro" class="tab-content active">
            <div class="card">
                <h1>Cadastro de Estudante</h1>
                <form id="formCadastro">
                    <div class="input-group">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" placeholder="Digite seu nome completo">
                    </div>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="seu@email.com">
                    </div>
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)">
                    </div>
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <div class="password-wrapper">
                            <input type="password" id="senha" placeholder="Mínimo 6 caracteres com números">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirmar">Confirmar Senha</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmar" placeholder="Confirme sua senha">
                        </div>
                    </div>
                    <button type="button" onclick="cadastrar()">Cadastrar</button>
                    <p id="mensagem" class="mensagem"></p>
                </form>
            </div>
        </div>

        <div id="abaLogin" class="tab-content">
            <div class="card">
                <h1>Acesso do Aluno</h1>
                <form id="formLogin">
                    <div class="input-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="Seu email cadastrado">
                    </div>
                    <div class="input-group">
                        <label for="loginSenha">Senha</label>
                        <div class="password-wrapper">
                            <input type="password" id="loginSenha" placeholder="Sua senha">
                        </div>
                    </div>
                    <button type="button" onclick="fazerLogin()">Entrar</button>
                    <p id="mensagemLogin" class="mensagem"></p>
                </form>
            </div>
        </div>

    <script src="script.js"></script>
</body>
</html>
